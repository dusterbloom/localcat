[project]
name = "macos-local-voice-agents-server"
version = "0.1.0"
description = "Local voice agents server for macOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pip",
    "python-dotenv",
    "fastapi[all]",
    "uvicorn",
    "opencv-python",
    "mlx-lm",
    "mlx-audio",
    "pipecat-ai[deepgram,mlx-whisper,openai,rime,silero]==0.0.85",
    "pipecat-ai-small-webrtc-prebuilt",
    "aiortc",
    "nltk",
    "spacy>=3.7.0",
    "spacy-coref>=0.3.1",
    "pyobjc-core",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-ApplicationServices",
    "kokoro-onnx>=0.4.9",
    "kokoro>=0.9.4",
    "soundfile>=0.13.1",
    "httpx==0.28.1",
]
