[pytest]
# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Timeout configuration (requires pytest-timeout plugin)
# timeout = 300
# timeout_method = thread

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast unit tests
    integration: marks tests as integration tests requiring external services
    requires_models: marks tests that require ML models to be downloaded
    requires_llm: marks tests that require LLM server to be running
    ci: marks tests suitable for CI/CD pipeline
    skip_ci: marks tests to skip in CI/CD environments

# Warnings
filterwarnings =
    ignore::DeprecationWarning:audioop
    ignore::DeprecationWarning:click.parser
    ignore::FutureWarning:transformers.utils.hub

# Coverage options (if using pytest-cov)
addopts =
    --strict-markers
    --tb=short
    -v